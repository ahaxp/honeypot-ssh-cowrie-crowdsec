services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ./cowrie/log:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt
    networks:
      - honeytrapnet
  
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd"
      GID: "1000"
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - ./crowdsec/parsers:/etc/crowdsec/parsers
      - ./crowdsec/scenarios:/etc/crowdsec/scenarios
      - ./cowrie/log:/var/log/cowrie:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - honeytrapnet
  
  attacker:
    build: ./attacker
    container_name: attacker
    command: sleep infinity
    networks:
      - honeytrapnet

networks:
  honeytrapnet:
    driver: bridge